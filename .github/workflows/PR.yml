name: CI - pull request

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar o repositório e trocar para a branch específica
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # 2. Instalar o interpretador (Node.js)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instalar as dependências do projeto
      - name: Instalar dependências
        run: npm ci

      # 4. Verificação de Linter
      - name: Verificação de Linter
        run: npm run lint

      # 5. Executar testes e cobertura de código
      - name: Executar testes e cobertura de código
        run: npm test