name: Workflow de Commits

on:
  push:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trocar para a branch do commit
        run: git switch ${{ github.ref_name }}

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de Linter
        run: npm run lint

      - name: Executar testes e cobertura de código
        run: npm test

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  construir_imagem:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t luc2110/sistema-academico-api:${{ github.sha }} .

      - name: Exportar imagem Docker
        run: docker save luc2110/sistema-academico-api:${{ github.sha }} -o imagem.tar

      - name: Enviar imagem como artefato
        uses: actions/upload-artifact@v4
        with:
          name: imagem-docker
          path: imagem.tar
          retention-days: 1

  publicar_imagem:
    if: github.ref == 'refs/heads/main'
    needs: [testes, construir_imagem]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar imagem construída
        uses: actions/download-artifact@v4
        with:
          name: imagem-docker

      - name: Carregar imagem Docker
        run: docker load -i imagem.tar

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagem no Docker Hub
        run: |
          docker tag luc2110/sistema-academico-api:${{ github.sha }} luc2110/sistema-academico-api:latest
          docker push luc2110/sistema-academico-api:latest
